<!doctype html>
<html lang="en">
<head>
    <title>Matzo Mate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        :root {
            --bg:      #0e0e0e;
            --surface: #1a1a1a;
            --surface2:#222;
            --border:  #2e2e2e;
            --text:    #e8e8e8;
            --muted:   #888;
            --radius:  12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 16px;
            max-width: 560px;
            margin: 0 auto;
        }

        h1 { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 16px; }

        .controls { display: flex; gap: 8px; margin-bottom: 14px; }

        input#upc {
            flex: 1; padding: 13px 14px; font-size: 16px;
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius); outline: none;
        }
        input#upc:focus { border-color: #555; }

        button {
            padding: 13px 16px; font-size: 15px; font-weight: 600;
            background: #fff; color: #000; border: none;
            border-radius: var(--radius); cursor: pointer; white-space: nowrap;
        }
        button:active { opacity: 0.75; }
        button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

        #video {
            display: none; width: 100%;
            border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 12px;
        }

        #queue { margin-bottom: 14px; }

        .scan-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        .scan-card.pass { border-color: #1a5c32; }
        .scan-card.fail { border-color: #5c1a1a; }

        .scan-card-header {
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 10px; margin-bottom: 8px;
        }
        .scan-card-name { font-size: 16px; font-weight: 600; line-height: 1.3; flex: 1; }
        .scan-card-upc  { font-size: 11px; color: var(--muted); margin-top: 2px; }

        .badge {
            flex-shrink: 0; padding: 4px 11px;
            border-radius: 20px; font-size: 12px; font-weight: 700;
        }
        .badge.pass    { background: #0f3d22; color: #4caf80; }
        .badge.fail    { background: #3a0e0e; color: #e05555; }
        .badge.pending { background: #1e1e1e; color: var(--muted); }

        .mini-spinner {
            display: inline-block; width: 12px; height: 12px;
            border: 2px solid #444; border-top-color: #aaa;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 5px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .card-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
        .card-meta a { color: var(--muted); text-decoration: underline; }

        .flag-list { list-style: none; }
        .flag-list li {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px;
        }
        .flag-list li:last-child { border-bottom: none; }

        .flag-tag {
            font-size: 10px; font-weight: 700; padding: 2px 6px;
            border-radius: 6px; text-transform: uppercase; letter-spacing: 0.4px;
        }
        .flag-tag.chametz { background: #3a0e0e; color: #e05555; }
        .flag-tag.ai      { background: #1a1a3a; color: #8080f0; }

        .ingredients-section { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
        .ingredients-toggle {
            font-size: 12px; color: var(--muted); cursor: pointer;
            user-select: none; display: flex; align-items: center; gap: 5px; margin-bottom: 7px;
        }
        .ingredients-toggle:hover { color: var(--text); }
        .ingredients-grid { display: none; flex-wrap: wrap; gap: 5px; }
        .ingredients-grid.open { display: flex; }
        .ingredient-pill {
            font-size: 11px; padding: 2px 9px; border-radius: 20px;
            background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
        }
        .ingredient-pill.flagged { background: #3a0e0e; color: #e05555; border-color: #5a1e1e; }

        .card-footer {
            display: flex; justify-content: flex-end;
            margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
        }
        .btn-delete {
            background: none; border: 1px solid #3a1a1a; color: #e05555;
            font-size: 12px; font-weight: 500; padding: 4px 10px;
            border-radius: 6px; cursor: pointer; opacity: 0.55;
            transition: opacity 0.15s, border-color 0.15s;
        }
        .btn-delete:hover { opacity: 1; border-color: #e05555; }

        .contribute-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .contribute-section p { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
        .contribute-section textarea {
            width: 100%; padding: 8px; font-size: 12px;
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px;
            resize: vertical; min-height: 60px; font-family: inherit; margin-bottom: 6px;
        }

        #history-section { margin-top: 20px; }
        .history-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
        .history-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 6px; font-size: 13px;
        }
        .history-item:hover { border-color: #555; }
        .history-item .h-name { font-weight: 500; }
        .history-item .h-upc  { font-size: 11px; color: var(--muted); }
        .history-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .history-dot.pass { background: #4caf80; }
        .history-dot.fail { background: #e05555; }

        #log-toggle { font-size: 11px; color: var(--muted); cursor: pointer; text-align: center; padding: 6px; margin-top: 10px; }
        #log {
            display: none; white-space: pre-wrap; font-family: monospace;
            font-size: 11px; color: var(--muted); background: #111;
            border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; max-height: 160px; overflow-y: auto; margin-top: 4px;
        }
    </style>
</head>
<body>
    <h1>🫓 Matzo Mate</h1>

    <video id="video" playsinline autoplay></video>

    <div class="controls">
        <input type="text" id="upc" placeholder="Enter or scan UPC" inputmode="numeric" />
        <button id="btn-scan" class="secondary">📷</button>
        <button id="btn-check">Check</button>
    </div>

    <div id="queue"></div>

    <div id="log-toggle">▼ Debug log</div>
    <div id="log"></div>

    <div id="history-section" style="display:none">
        <div class="history-label">Recent scans</div>
        <div id="history-list"></div>
    </div>

    <script>
    const jobs      = new Map();
    const upcInput  = document.getElementById("upc");
    const video     = document.getElementById("video");
    const queueEl   = document.getElementById("queue");
    const logEl     = document.getElementById("log");
    const histSection = document.getElementById("history-section");
    const histList    = document.getElementById("history-list");

    let stream = null, scanning = false, logVisible = false;

    // ── TTS ──────────────────────────────────────────────────────────────
    const synth    = window.speechSynthesis;
    const ttsQueue = [];
    let   ttsBusy  = false;

    function speak(text) { ttsQueue.push(text); drainTTS(); }

    function drainTTS() {
        if (ttsBusy || !ttsQueue.length) return;
        ttsBusy = true;
        const utt = new SpeechSynthesisUtterance(ttsQueue.shift());
        utt.rate  = 1.05;
        utt.onend = utt.onerror = () => { ttsBusy = false; drainTTS(); };
        synth.speak(utt);
    }

    // ── Audio / haptics ───────────────────────────────────────────────────
    function playSound(name) {
        try { new Audio(`/sounds/${name}.mp3`).play(); } catch(e) {}
    }
    function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p); }

    // ── Log ───────────────────────────────────────────────────────────────
    function appendLog(t) { logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight; }
    document.getElementById("log-toggle").addEventListener("click", () => {
        logVisible = !logVisible;
        logEl.style.display = logVisible ? "block" : "none";
        document.getElementById("log-toggle").textContent = logVisible ? "▲ Debug log" : "▼ Debug log";
    });

    // ── Scanner ───────────────────────────────────────────────────────────
    document.getElementById("btn-scan").addEventListener("click", async () => {
        if (scanning) { stopScan(); return; }
        if (!("BarcodeDetector" in window)) { alert("Barcode scanning not supported."); return; }
        const det = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });
        try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); }
        catch { alert("Camera permission denied."); return; }
        video.srcObject = stream;
        video.style.display = "block";
        scanning = true;
        document.getElementById("btn-scan").textContent = "✕";
        const loop = async () => {
            if (!scanning) return;
            try {
                const codes = await det.detect(video);
                if (codes.length) { upcInput.value = codes[0].rawValue; stopScan(); runCheck(); return; }
            } catch {}
            requestAnimationFrame(loop);
        };
        loop();
    });

    function stopScan() {
        scanning = false;
        video.style.display = "none";
        stream?.getTracks().forEach(t => t.stop());
        document.getElementById("btn-scan").textContent = "📷";
    }

    // ── Run check ─────────────────────────────────────────────────────────
    document.getElementById("btn-check").addEventListener("click", runCheck);
    upcInput.addEventListener("keydown", e => { if (e.key === "Enter") runCheck(); });

    function runCheck() {
        const upc = upcInput.value.trim();
        if (!upc) { alert("Please enter a UPC."); return; }
        upcInput.value = "";

        if (jobs.has(upc)) { speak(`${upc} is already being checked.`); return; }

        const cached = getCachedResult(upc);
        if (cached) {
            const card = createCard(upc);
            setTimeout(() => finaliseCard(card, upc, cached), 200);
            return;
        }

        // Only announce "checking" for new lookups
        speak(`Checking, please continue scanning.`);

        const card = createCard(upc);
        const es   = new EventSource(`/stream/${encodeURIComponent(upc)}`);
        jobs.set(upc, { es, card });

        es.onmessage = event => {
            appendLog(event.data);
            if (event.data.startsWith("RESULT:")) {
                try {
                    const data = JSON.parse(event.data.slice(7));
                    finaliseCard(card, upc, data);
                    saveCachedResult(upc, data);
                } catch(e) { appendLog("Parse error: " + e); }
                jobs.delete(upc);
                es.close();
            }
        };

        es.onerror = () => {
            setCardError(card, upc);
            jobs.delete(upc);
            es.close();
        };
    }

    // ── Card helpers ──────────────────────────────────────────────────────
    function createCard(upc) {
        const card = document.createElement("div");
        card.className   = "scan-card";
        card.dataset.upc = upc;
        card.innerHTML   = `
            <div class="scan-card-header">
                <div>
                    <div class="scan-card-name">${esc(upc)}</div>
                </div>
                <div class="badge pending"><span class="mini-spinner"></span>Checking…</div>
            </div>`;
        queueEl.prepend(card);
        return card;
    }

    function finaliseCard(card, upc, data) {
        const name    = data.product_name || "Unknown product";
        const isFail  = (data.chametz?.length > 0) || (data.ai_flags?.length > 0);
        const status  = isFail ? "fail" : "pass";
        const flagged = new Set([
            ...(data.chametz  || []).map(s => s.toLowerCase()),
            ...(data.ai_flags || []).map(s => s.replace(/\[AI flagged\]:\s*/i,"").toLowerCase()),
        ]);

        const flagsHTML = [
            ...(data.chametz  || []).map(i => `<li><span class="flag-tag chametz">chametz</span> ${esc(i)}</li>`),
            ...(data.ai_flags || []).map(i => `<li><span class="flag-tag ai">AI</span> ${esc(i)}</li>`),
        ].join("");

        const pills = (data.ingredients || []).map(i =>
            `<span class="ingredient-pill${flagged.has(i.toLowerCase())?" flagged":""}">${esc(i)}</span>`
        ).join("");

        const ingCount = (data.ingredients||[]).length;

        card.className = `scan-card ${status}`;
        card.innerHTML = `
            <div class="scan-card-header">
                <div>
                    <div class="scan-card-name">${esc(name)}</div>
                    <div class="scan-card-upc">${esc(upc)}</div>
                </div>
                <div class="badge ${status}">${isFail ? "Not Kosher" : "Probably OK ✓"}</div>
            </div>
            <div class="card-meta">
                Source: ${esc(data.source||"—")} &nbsp;|&nbsp;
                <a href="${esc(data.url||"#")}" target="_blank" rel="noopener">View ↗</a>
            </div>
            ${flagsHTML ? `<ul class="flag-list">${flagsHTML}</ul>` : ""}
            ${pills ? `
            <div class="ingredients-section">
                <div class="ingredients-toggle">
                    <span class="ing-arrow">▶</span>
                    <span class="ing-label">Show all ingredients (${ingCount})</span>
                </div>
                <div class="ingredients-grid">${pills}</div>
            </div>` : ""}
            ${ingCount <= 1 ? `
            <div class="contribute-section">
                <p>⚠ Ingredient data looks incomplete. Know what's in this product?</p>
                <textarea class="contribute-text" placeholder="Paste ingredients here…"></textarea>
                <button class="btn-contribute">Submit</button>
            </div>` : ""}
            <div class="card-footer">
                <button class="btn-delete">Delete from database</button>
            </div>`;

        // Ingredient toggle
        card.querySelector(".ingredients-toggle")?.addEventListener("click", function() {
            const grid = this.nextElementSibling;
            const open = grid.classList.toggle("open");
            this.querySelector(".ing-arrow").textContent = open ? "▼" : "▶";
            this.querySelector(".ing-label").textContent =
                `${open?"Hide":"Show"} all ingredients (${ingCount})`;
        });

        // Contribute
        card.querySelector(".btn-contribute")?.addEventListener("click", () => {
            const text = card.querySelector(".contribute-text").value.trim();
            if (!text) return;
            fetch("/contribute", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ upc, ingredients: text }),
            }).then(() => card.querySelector(".contribute-section")?.remove());
        });

        // Delete
        card.querySelector(".btn-delete").addEventListener("click", async () => {
            if (!confirm(`Delete ${upc} from database?`)) return;
            if (await deleteFromDB(upc)) card.remove();
        });

        // TTS verdict
        const shortName = name.length > 40 ? name.slice(0,40) + "…" : name;
        speak(isFail
            ? `${shortName} is not kosher for Passover.`
            : `${shortName} is kosher for Passover.`);
        isFail ? (playSound("error"), vibrate([100,50,100])) : (playSound("ding"), vibrate([40]));

        saveHistory({ upc, name, status });
        renderHistory();
    }

    function setCardError(card, upc) {
        card.querySelector(".badge").className = "badge pending";
        card.querySelector(".badge").innerHTML = "Not found";
        speak(`Could not find product for ${upc}.`);
    }

    function esc(s) {
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ── localStorage ─────────────────────────────────────────────────────
    const HISTORY_KEY = "mm_history", RESULT_KEY = "mm_results", MAX_HISTORY = 20;

    function saveHistory(e) {
        const h = getHistory().filter(x => x.upc !== e.upc);
        h.unshift(e);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0,MAX_HISTORY)));
    }
    function getHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]"); } catch { return []; }
    }
    function saveCachedResult(upc, data) {
        const all = getCachedResults();
        all[upc] = { data, ts: Date.now() };
        localStorage.setItem(RESULT_KEY, JSON.stringify(all));
    }
    function getCachedResults() {
        try { return JSON.parse(localStorage.getItem(RESULT_KEY)||"{}"); } catch { return {}; }
    }
    function getCachedResult(upc) {
        const e = getCachedResults()[upc];
        if (!e || Date.now()-e.ts > 7*86400*1000) return null;
        return e.data;
    }

    // ── Delete ────────────────────────────────────────────────────────────
    async function deleteFromDB(upc) {
        try {
            const r = await fetch("/delete", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({upc}),
            });
            if ((await r.json()).ok) {
                const all = getCachedResults(); delete all[upc];
                localStorage.setItem(RESULT_KEY, JSON.stringify(all));
                const h = getHistory().filter(x => x.upc !== upc);
                localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
                renderHistory(); return true;
            }
        } catch(e) { appendLog("Delete failed: "+e); }
        return false;
    }

    // ── History ───────────────────────────────────────────────────────────
    function renderHistory() {
        const hist = getHistory();
        histSection.style.display = hist.length ? "block" : "none";
        histList.innerHTML = "";
        hist.forEach(entry => {
            const div = document.createElement("div");
            div.className = "history-item";
            div.innerHTML = `
                <div class="history-dot ${entry.status}"></div>
                <div style="flex:1;min-width:0;cursor:pointer">
                    <div class="h-name">${esc(entry.name||"Unknown")}</div>
                    <div class="h-upc">${esc(entry.upc)}</div>
                </div>
                <button class="btn-delete" style="font-size:11px;padding:3px 8px">Delete</button>`;
            div.querySelector("[style*='flex']").addEventListener("click", () => {
                upcInput.value = entry.upc; runCheck();
            });
            div.querySelector(".btn-delete").addEventListener("click", async e => {
                e.stopPropagation();
                if (!confirm(`Delete ${entry.upc}?`)) return;
                await deleteFromDB(entry.upc);
            });
            histList.appendChild(div);
        });
    }

    renderHistory();
    </script>
</body>
</html>
